# cargo-deny policy (ADR 0069): licences and sources of the Rust dependencies.
# Known vulnerabilities are checked by osv-scanner (osv-scanner.toml), not here.
[graph]
all-features = true

[licenses]
# TradoCraft is AGPL-3.0-or-later, so its dependencies must be permissive licences (or the
# project's own). A crate that offers a choice (`MIT OR GPL-2.0-only`) passes through the
# permissive one. A new licence fails the check: review it, then add it here with a reason.
allow = [
  "AGPL-3.0-or-later", # the workspace crates themselves
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "BSL-1.0",
  "Unlicense",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0", # webpki-roots (the CA certificate list)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true # the workspace crates depend on each other by path

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
