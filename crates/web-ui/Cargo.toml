[package]
name = "tradocraft-web-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos CSR web interface for TradoCraft (Phase 1 spike)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
rust_decimal = { version = "1", default-features = false, features = ["serde-with-str"] }
serde = { workspace = true }
serde_json = { workspace = true }
tradocraft-api-client = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
uuid = { workspace = true, features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Location", "Window"] }
