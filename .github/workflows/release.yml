name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signing (GitHub OIDC), docs/RELEASING.md

jobs:
  release-info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      owner: ${{ steps.release.outputs.owner }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a tag such as v0.3.0"; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          VERSION="${RELEASE_TAG#v}"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

  docker-backend:
    needs: release-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-info.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Pin by X.Y.Z; X.Y follows the newest patch release. No `latest`: pre-1.0 every
          # minor release may break compatibility (docs/RELEASING.md).
          tags: |
            ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-backend:${{ needs.release-info.outputs.version }}
            ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-backend:${{ needs.release-info.outputs.minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the image (cosign, keyless)
        env:
          IMAGE: ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-backend
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  docker-web:
    needs: release-info
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-info.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-web:${{ needs.release-info.outputs.version }}
            ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-web:${{ needs.release-info.outputs.minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the image (cosign, keyless)
        env:
          IMAGE: ghcr.io/${{ needs.release-info.outputs.owner }}/tradocraft-web
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  windows-app:
    needs: release-info
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-info.outputs.tag }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.release-info.outputs.version }}
      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../dist/tradocraft-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: tradocraft-windows-x64
          path: dist/tradocraft-windows-x64.zip

  windows-demo:
    needs: release-info
    uses: ./.github/workflows/windows-demo.yml
    with:
      ref: refs/tags/${{ needs.release-info.outputs.tag }}
      version: ${{ needs.release-info.outputs.version }}

  release:
    needs: [release-info, docker-backend, docker-web, windows-app, windows-demo]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: smoke${{ github.run_id }}   # throwaway: the smoke-test stack is removed below
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-info.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: tradocraft-windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: tradocraft-demo-windows-x64
          path: dist
      - name: Prepare docker-compose.yml
        env:
          IMAGE_OWNER: ${{ needs.release-info.outputs.owner }}
          IMAGE_VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          sed -E -e "s@ghcr.io/tradocraft/@ghcr.io/${IMAGE_OWNER}/@g" \
              -e "s/(TRADOCRAFT_VERSION:-)[0-9]+\.[0-9]+\.[0-9]+\}/\1${IMAGE_VERSION}}/g" deploy/docker-compose.release.yml > dist/docker-compose.yml
          docker compose -f dist/docker-compose.yml config -q
      - name: Smoke-test the packaged release
        run: |
          docker compose -f dist/docker-compose.yml pull || {
            echo "::error::Could not pull the release images anonymously. Check that both TradoCraft GHCR packages are public and available, then rerun this job."
            exit 1
          }
          docker compose -f dist/docker-compose.yml up -d --wait --wait-timeout 180
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://localhost:8088/
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://localhost:8088/api/v1/meta/environment |
            jq -e '.kind == "tutorial"'
          curl --fail --silent --show-error -H 'X-Dev-User: admin@example.com' http://localhost:8088/api/v1/me > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://localhost:8090/health
          docker compose -f dist/docker-compose.yml exec -T api typst --version
          docker compose -f dist/docker-compose.yml exec -T api test -w /var/lib/tradocraft/files
          docker compose -f dist/docker-compose.yml exec -T worker test -w /app/outbox
      - name: Stop smoke-test containers
        if: always()
        run: |
          if [ -f dist/docker-compose.yml ]; then
            docker compose -f dist/docker-compose.yml down --volumes
          fi
      - uses: sigstore/cosign-installer@v3
      - name: Checksums and signature
        working-directory: dist
        run: |
          sha256sum tradocraft-windows-x64.zip docker-compose.yml tradocraft-demo-windows-x64* > SHA256SUMS
          cat SHA256SUMS
          # Keyless: the signature is bound to this workflow's GitHub OIDC identity and logged in
          # the public Rekor transparency log. SHA256SUMS.sigstore.json holds signature, certificate
          # and log proof (verification: docs/RELEASING.md).
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag dist/tradocraft-windows-x64.zip dist/docker-compose.yml dist/tradocraft-demo-windows-x64* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --title "TradoCraft $RELEASE_TAG" \
            --notes "For the offline Windows demo, extract the demo ZIP or run the per-user setup EXE. For Docker, set POSTGRES_PASSWORD in a .env file next to docker-compose.yml, then run docker compose up -d. Verify downloads with SHA256SUMS and cosign (docs/RELEASING.md). Open http://localhost:8088 for the Web UI, or extract the Windows x64 zip and connect to http://localhost:8080. Docker Desktop runs PostgreSQL and the prebuilt backend with Typst."
