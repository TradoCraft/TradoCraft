name: CI

on:
  # Branches with an open pull request would otherwise run everything twice (push and
  # pull_request); main still runs on every push.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradocraft
          POSTGRES_PASSWORD: tradocraft
          POSTGRES_DB: tradocraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tradocraft" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://tradocraft:tradocraft@localhost/tradocraft
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Typst
        run: |
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar -xJ
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - name: Install pdftotext
        # The quote remark test reads the printed PDF text to prove the production remark is absent.
        # Retries: the runner's mirrors fail to resolve now and then, which failed this job.
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y poppler-utils
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: OpenAPI document is up to date
        run: |
          cargo run -q -p tradocraft-api -- openapi > api/openapi.json
          git diff --exit-code api/openapi.json

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed with. `channel: stable` alone follows the
          # newest release, whose new deprecations (flutter analyze exits 1 on info-level issues)
          # break CI without any change to the code. Raise it together with the code (3.50.0: material_ui,
          # see ADR 0051).
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated API client is up to date
        run: |
          dart run swagger_parser
          dart run build_runner build -d
          git diff --exit-code lib/api/generated
      - run: flutter analyze
      - run: flutter test
