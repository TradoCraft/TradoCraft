name: Windows demo

on:
  pull_request:
    paths:
      - 'deploy/windows/**'
      - '.github/workflows/windows-demo.yml'
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'apps/**'
      - 'crates/**'
      - 'migrations/**'
      - 'seed/**'
      - 'templates/**'
      - 'Cargo.*'
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install Inno Setup on the build runner
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and smoke-test Windows demo packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || '0.0.0' }}
        run: ./deploy/windows/Build-Demo.ps1 -Version $env:PACKAGE_VERSION -Output dist
      - uses: actions/upload-artifact@v4
        with:
          name: tradocraft-demo-windows-x64
          path: dist/tradocraft-demo-windows-x64*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-demo-smoke-logs
          path: ~/AppData/Local/TradoCraft/Demo packaging smoke/logs/
