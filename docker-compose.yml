# Local development stack: PostgreSQL + API (development authentication, seed data).
#   docker compose up --build
# API: http://localhost:8080  ·  API docs: http://localhost:8080/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tradocraft
      POSTGRES_PASSWORD: tradocraft
      POSTGRES_DB: tradocraft
    ports:
      - "127.0.0.1:5433:5432"   # 5433: the host often already runs its own PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradocraft"]
      interval: 2s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tradocraft:tradocraft@db/tradocraft
      AUTH_MODE: dev            # never on a reachable server; use oidc in production
      # Inside the container the API binds 0.0.0.0, which dev auth only accepts when
      # acknowledged. This is safe solely because the port above is published on loopback.
      ALLOW_INSECURE_DEV_AUTH: "true"
      SEED_DEV_DATA: "true"
      # Environment shown in the app's banner (ADR 0043): kind is live, test or tutorial (an
      # unknown value stops the API); the name defaults to the database name.
      APP_ENV_KIND: live
      # APP_ENV_NAME: Acme production
      # First run without the demo seed (set SEED_DEV_DATA to "false"): the app's setup wizard
      # creates the company (ADR 0047). Outside AUTH_MODE=dev the endpoint is disabled unless this
      # secret is set (e.g. `openssl rand -hex 24`); in dev mode it is optional.
      # BOOTSTRAP_TOKEN: change-me
      # Identity providers are configured in the app (ADR 0051). OIDC_ISSUER and OIDC_AUDIENCE
      # (AUTH_MODE=oidc) are only the optional read-only fallback provider.
      # OIDC_ISSUER: https://login.example.com/realms/acme
      # OIDC_AUDIENCE: tradocraft
      RUST_LOG: info
    ports:
      - "127.0.0.1:8080:8080"   # loopback only: dev auth trusts X-Dev-User

  worker:
    build: .
    command: ["tradocraft-worker"]
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://tradocraft:tradocraft@db/tradocraft
      # Development: outgoing e-mails are written to /app/outbox instead of being sent.
      MAIL_TRANSPORT: files
      MAIL_FILES_DIR: /app/outbox
      # Incoming mail (optional):
      # IMAP_HOST: imap.example.com
      # IMAP_USER: helpdesk@example.com
      # IMAP_PASSWORD: ...
      # Real sending:
      # MAIL_TRANSPORT: smtp
      # SMTP_HOST: smtp.example.com
      # SMTP_USER / SMTP_PASSWORD
      POLL_SECONDS: "15"
      RUST_LOG: info

volumes:
  pgdata:
